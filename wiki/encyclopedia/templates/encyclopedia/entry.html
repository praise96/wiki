{% extends "encyclopedia/layout.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block body %}
    <div class="row" style="margin-bottom: 20px; align-items: center;">
        <div class="col-8">
            <h1>{{ title }}</h1> 
        </div>
        <div class="col-4" style="text-align: right;">
            <a href="{% url 'edit' title %}" class="btn btn-secondary">Edit This Page</a>
        </div>
    </div>

    <hr>

    {{ content|safe }}
{% endblock %}
